server {
    listen 80;
    server_name biy.benlocher.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name biy.benlocher.com;
    ssl_certificate /etc/letsencrypt/live/biy.benlocher.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biy.benlocher.com/privkey.pem;
    root /var/www/biy.benlocher.com/dist;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 1m;
    location /api/ {
        proxy_pass http://127.0.0.1:8017;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /protected-media/ {
        internal;
        alias /var/lib/biy/media/;
        add_header Cache-Control "private, no-store";
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
