<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123f34" />
    <script>
      // Apply the saved/device theme before styles and React load to avoid a flash.
      (() => {
        let preference;
        try { preference = localStorage.getItem("biy-theme"); } catch {}
        const theme = preference === "light" || preference === "dark"
          ? preference : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = theme === "dark" ? "#151e1b" : "#fbfaf6";
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#151e1b" : "#123f34";
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="application-name" content="Bible in a Year" />
    <meta name="apple-mobile-web-app-title" content="Bible in a Year" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Bible in a Year · Your daily companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,500;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
